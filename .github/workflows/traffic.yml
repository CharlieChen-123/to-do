name: Save GitHub Traffic

on:
  schedule:
    - cron: "37 23 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-traffic-history
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Save traffic history and generate reports
        uses: jgehrcke/github-repo-stats@v1.4.2
        with:
          ghtoken: ${{ secrets.GHRS_GITHUB_API_TOKEN }}
          databranch: github-repo-stats
